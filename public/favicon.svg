<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Background -->
  <rect width="192" height="192" fill="#000000" rx="40"/>
  
  <!-- Primary red accent circle -->
  <circle cx="96" cy="96" r="85" fill="none" stroke="#E60000" stroke-width="3"/>
  
  <!-- Car silhouette -->
  <g transform="translate(96, 96)">
    <!-- Car body -->
    <path d="M -35 -10 L -25 -25 L 25 -25 L 35 -10 L 35 15 L -35 15 Z" fill="#E60000" stroke="#E60000" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Windows -->
    <rect x="-28" y="-20" width="18" height="12" fill="#1a1a1a" rx="2"/>
    <rect x="10" y="-20" width="18" height="12" fill="#1a1a1a" rx="2"/>
    
    <!-- Wheels -->
    <circle cx="-20" cy="18" r="8" fill="#E60000" stroke="#E60000" stroke-width="1"/>
    <circle cx="20" cy="18" r="8" fill="#E60000" stroke="#E60000" stroke-width="1"/>
    
    <!-- Wheel rims -->
    <circle cx="-20" cy="18" r="5" fill="none" stroke="#000000" stroke-width="1"/>
    <circle cx="20" cy="18" r="5" fill="none" stroke="#000000" stroke-width="1"/>
  </g>
  
  <!-- Text: CARFLEX -->
  <text x="96" y="155" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#E60000" text-anchor="middle" letter-spacing="2">CARFLEX</text>
</svg>
